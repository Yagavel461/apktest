name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI with one click

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java JDK 17
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Set up Flutter Environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      # Step 4: Verify Flutter & Environment
      - name: Verify Flutter Installation
        run: flutter doctor -v

      # Step 5: Install Project Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Step 6: Run Unit & Calculation Tests
      - name: Run Tests
        run: flutter test

      # Step 7: Build Release APK
      - name: Build Android Release APK
        run: flutter build apk --release

      # Step 8: Upload Compiled APK as downloadable Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UK-POS-Billing-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
